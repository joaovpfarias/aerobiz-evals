name: secret-scan

# Runs on pushes/PRs against main and once a week on a schedule, so leaked
# secrets or accidental copyrighted-binary commits get caught even if no
# one touches the repo for a while.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC

# Minimal default permissions; jobs only read repo contents.
permissions:
  contents: read

jobs:
  # Scans the full git history for committed secrets (API keys, tokens, etc.)
  # and fails the build if any are found.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret history scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Copyright safety net: this is a research repo about emulation and must
  # never ship actual ROMs/savestates or other large binary blobs. This job
  # fails the build if any ROM/savestate-like extension or any file over
  # 5 MB shows up in the repo.
  no-binaries:
    name: no-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on ROM/savestate files or large binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for ROM/savestate-like files..."
          # Copyrighted ROM/savestate extensions must never be committed.
          rom_files=$(git ls-files -z | xargs -0 -I{} bash -c 'case "{}" in *.sfc|*.smc|*.rom|*.state|*.sav|*.bin) echo "{}";; esac')

          if [ -n "$rom_files" ]; then
            echo "ERROR: found ROM/savestate-like file(s) in the repo:"
            echo "$rom_files"
            exit 1
          fi

          echo "Checking for files larger than 5 MB..."
          large_files=$(git ls-files -z | xargs -0 -I{} bash -c 'f="{}"; if [ -f "$f" ] && [ "$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")" -gt 5242880 ]; then echo "$f"; fi')

          if [ -n "$large_files" ]; then
            echo "ERROR: found file(s) larger than 5 MB:"
            echo "$large_files"
            exit 1
          fi

          echo "OK: no ROM/savestate files or oversized binaries found."

  # Syntax-only sanity check for every Python source file.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all Python files (syntax check only)
        run: python -m compileall -q .

  # The offline half of the test suite DOES run in CI. It needs no emulator and
  # no ROM: it reads the screenshot fixtures committed under logs/ and exercises
  # the screen-reading code against them. The live half (which drives BizHawk)
  # is the part that cannot run here.
  offline-tests:
    name: offline-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the offline suite
        run: python harness/test_harness.py --offline
